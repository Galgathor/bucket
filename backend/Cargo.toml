[package]
name = "bucket"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
async-trait = "0.1"
fs2 = "0.4"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "limit", "trace", "timeout"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
imap = "=3.0.0-alpha.15"
imap-proto = "0.16"
native-tls = "0.2"
url = "2"
regex = "1"
mailparse = "0.16"
ammonia = "4"
lettre = { version = "0.11.24", default-features = false, features = ["smtp-transport", "native-tls", "builder"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
base64 = "0.22"
