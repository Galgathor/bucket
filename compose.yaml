services:
  bucket:
    image: ${BUCKET_IMAGE:-ghcr.io/galgathor/bucket:latest}
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    env_file: .env
    environment:
      BUCKET_DATABASE: /data/bucket.db
      BUCKET_BIND: 0.0.0.0:8080
      BUCKET_FRONTEND_DIR: /app/static
    volumes:
      - bucket-data:/data
    ports:
      - "${BUCKET_LISTEN_ADDRESS:-127.0.0.1}:${BUCKET_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  bucket-data:
